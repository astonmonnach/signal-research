name: morning-briefing

# Weekdays 05:30 UTC (06:30 UK in summer, 05:30 in winter). The evening Claude job
# (21:30 UK) writes the SEC/DoD triage; this job adds positions, commodities/peers and the
# ledger, rebuilds the daily scans, stock dossiers and weekly/monthly/quarterly reports
# (reports/), then sends one briefing to Discord/Telegram.
on:
  schedule:
    # GitHub often starts scheduled runs late (5 Oct: 7 hours). Several slots; the
    # briefing sends only once per day (briefings/.sent-DATE marker).
    - cron: "7 4 * * 1-5"
    - cron: "37 4 * * 1-5"
    - cron: "7 5 * * 1-5"
    - cron: "37 5 * * 1-5"
    - cron: "7 6 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: morning-briefing
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # One secret with a 'name=url' line per channel (briefing/notify.py). The single-channel
      # secrets below still work and win over it.
      DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
      DISCORD_WEBHOOKS_2: ${{ secrets.DISCORD_WEBHOOKS_2 }}
      DISCORD_WEBHOOKS_3: ${{ secrets.DISCORD_WEBHOOKS_3 }}
      DISCORD_WEBHOOKS_4: ${{ secrets.DISCORD_WEBHOOKS_4 }}
      DISCORD_WEBHOOKS_5: ${{ secrets.DISCORD_WEBHOOKS_5 }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_WEBHOOK_CALENDAR: ${{ secrets.DISCORD_WEBHOOK_CALENDAR }}
      DISCORD_WEBHOOK_LEDGER: ${{ secrets.DISCORD_WEBHOOK_LEDGER }}
      DISCORD_WEBHOOK_PRESS: ${{ secrets.DISCORD_WEBHOOK_PRESS }}
      DISCORD_WEBHOOK_FILINGS: ${{ secrets.DISCORD_WEBHOOK_FILINGS }}
      DISCORD_WEBHOOK_WATCHLIST: ${{ secrets.DISCORD_WEBHOOK_WATCHLIST }}
      DISCORD_WEBHOOK_SETUPS: ${{ secrets.DISCORD_WEBHOOK_SETUPS }}
      DISCORD_WEBHOOK_CRYPTO: ${{ secrets.DISCORD_WEBHOOK_CRYPTO }}
      DISCORD_WEBHOOK_REPORTS: ${{ secrets.DISCORD_WEBHOOK_REPORTS }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Positions and NQ regime
        continue-on-error: true
        run: |
          python collectors/positions.py
          python collectors/nq_regime.py
      - name: Commodities and peer moves
        continue-on-error: true
        run: python collectors/market_context.py
      - name: Funding pots (every award from each capped fund's office, watch/pots/)
        continue-on-error: true
        run: python collectors/funding_pot.py
      - name: Ledger
        continue-on-error: true
        run: python ledger/build_ledger.py
      - name: Public calls (calls/README.md, marked from the next open vs IWM and a control)
        continue-on-error: true
        run: python calls/build_calls.py --announce
      - name: Long-term (longterm/README.md; new candidates and the Monday summary to #long-term, once each)
        continue-on-error: true
        run: python longterm/build_longterm.py --post-weekly
      # Read-only over the files above (plus Yahoo closes for the periodic reports); idempotent, so
      # the later slots only commit when an input changed.
      - name: Daily scans (scans/YYYY-MM-DD.md, today and the 6 days before)
        continue-on-error: true
        run: python reports/build_scans.py
      - name: Stock dossiers (stocks/TICKER.md, only the part below the AUTO marker)
        continue-on-error: true
        run: python reports/build_stocks.py
      - name: Weekly, monthly and quarterly reports (current periods; the Discord weekly recap is sent Fridays by evening-recap)
        continue-on-error: true
        run: python reports/build_periodic.py --current
      - name: Briefing (write + send)
        run: python briefing/morning.py
      - name: Commit outputs
        run: |
          git config user.name "signal-lab-bot"
          git config user.email "signal-lab-bot@users.noreply.github.com"
          git add -A watch/ ledger/ calls/ longterm/ briefings/ data/press/ data/context/ scans/ stocks/ reports/ 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "morning briefing $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs -q && git push -q && exit 0; git rebase --abort 2>/dev/null; sleep $((i*5)); done
          exit 1
