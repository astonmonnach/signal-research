name: announce

# A new public call (calls/CALLS.csv) or new long-term research (longterm/candidates.csv) is
# posted to Discord within a minute or two of being pushed, instead of waiting for the next
# morning. Each one posts once (calls/announced.json, longterm/state.json); the morning job
# runs the same scripts, so nothing is posted twice.
on:
  push:
    branches: [main]
    paths:
      - calls/CALLS.csv
      - longterm/candidates.csv
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: morning-briefing
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
      DISCORD_WEBHOOKS_2: ${{ secrets.DISCORD_WEBHOOKS_2 }}
      DISCORD_WEBHOOKS_3: ${{ secrets.DISCORD_WEBHOOKS_3 }}
      DISCORD_WEBHOOKS_4: ${{ secrets.DISCORD_WEBHOOKS_4 }}
      DISCORD_WEBHOOKS_5: ${{ secrets.DISCORD_WEBHOOKS_5 }}
      DISCORD_WEBHOOK_CALLS: ${{ secrets.DISCORD_WEBHOOK_CALLS }}
      DISCORD_WEBHOOK_LONGTERM: ${{ secrets.DISCORD_WEBHOOK_LONGTERM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Calls
        continue-on-error: true
        run: python calls/build_calls.py --announce
      - name: Long-term
        continue-on-error: true
        run: python longterm/build_longterm.py --post-weekly
      - name: Commit outputs
        run: |
          git config user.name "signal-lab-bot"
          git config user.email "signal-lab-bot@users.noreply.github.com"
          git add -A calls/ longterm/ 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "announce $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase --autostash -X theirs -q && git push -q && exit 0; git rebase --abort 2>/dev/null; sleep $((i*5)); done
          exit 1
