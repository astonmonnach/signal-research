name: site

# Rebuilds the research website (site/build_site.py -> GitHub Pages) whenever the research changes:
# after the morning, evening, announce and backfill jobs, and on any push that touches research files
# (not the 20-minute press and crypto commits). One-time setup: repo Settings -> Pages -> Source: GitHub Actions.
on:
  workflow_run:
    workflows: ["morning-briefing", "evening-recap", "announce", "backfill"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "**"
      - "!data/press/**"
      - "!watch/press/**"
      - "!data/crypto/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: python site/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
