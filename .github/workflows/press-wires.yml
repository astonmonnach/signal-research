name: press-wires

# Company press releases from trusted wires (GlobeNewswire, PR Newswire, Business Wire,
# company IR feeds). Feeds only keep their newest ~20 items, so this runs every 20 minutes.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: press-wires
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Press wires
        run: python collectors/press_wires.py
      - name: Commit data
        run: |
          git config user.name "signal-lab-bot"
          git config user.email "signal-lab-bot@users.noreply.github.com"
          git add data/press/ watch/press/
          git diff --cached --quiet && exit 0
          git commit -m "press wires $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
