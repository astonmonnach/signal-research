name: evening-recap

# After the US close (20:00 UTC until 1 Nov, 21:00 UTC after). Refreshes positions, market caps and
# the calls, then posts the daily recap, one post per size bucket, positions, calls and setups, and on
# Fridays the weekly recap (briefing/recap.py). Several slots because GitHub often starts scheduled runs
# late; the recap sends once per trading day (recaps/.sent-DATE).
on:
  schedule:
    - cron: "15 21 * * 1-5"
    - cron: "45 21 * * 1-5"
    - cron: "15 22 * * 1-5"
    - cron: "45 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: morning-briefing
  cancel-in-progress: false

jobs:
  recap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
      DISCORD_WEBHOOKS_2: ${{ secrets.DISCORD_WEBHOOKS_2 }}
      DISCORD_WEBHOOKS_3: ${{ secrets.DISCORD_WEBHOOKS_3 }}
      DISCORD_WEBHOOKS_4: ${{ secrets.DISCORD_WEBHOOKS_4 }}
      DISCORD_WEBHOOKS_5: ${{ secrets.DISCORD_WEBHOOKS_5 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Positions
        continue-on-error: true
        run: python collectors/positions.py
      - name: Market caps and size buckets
        continue-on-error: true
        run: python collectors/caps.py
      - name: Public calls (marks to today's close; posts new and closed calls once)
        continue-on-error: true
        run: python calls/build_calls.py --announce
      - name: Weekly report (Fridays, so the recap links to a current report)
        continue-on-error: true
        run: |
          if [ "$(date -u +%u)" = "5" ] || [ "$(date -u +%u)" = "6" ]; then python reports/build_periodic.py --current; fi
      - name: Recap (write + send)
        run: python briefing/recap.py
      - name: Commit outputs
        run: |
          git config user.name "signal-lab-bot"
          git config user.email "signal-lab-bot@users.noreply.github.com"
          git add -A watch/positions.md watch/caps.json calls/ recaps/ reports/ 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "evening recap $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs -q && git push -q && exit 0; git rebase --abort 2>/dev/null; sleep $((i*5)); done
          exit 1
